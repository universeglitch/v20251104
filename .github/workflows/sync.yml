name: Sync from edgetunnel

on:
  schedule:
    # 每 6 小时同步一次
    - cron: "0 */6 * * *"

  # 支持手动运行
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # Checkout 当前仓库
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Checkout 源仓库
      - name: Checkout edgetunnel
        uses: actions/checkout@v4
        with:
          repository: universeglitch/edgetunnel
          path: source
          fetch-depth: 1

      # 同步文件，但排除 wrangler.toml
      - name: Sync files
        run: |
          rsync -av \
            --exclude='wrangler.toml' \
            --exclude='.git/' \
            source/ ./

          rm -rf source

      # 提交并推送
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: sync from universeglitch/edgetunnel"
            git push
          fi
