name: Sync from edgetunnel

on:
  schedule:
    # 每 6 小时同步一次
    - cron: "0 */6 * * *"

  # 支持手动执行
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # 拉取当前仓库
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 拉取 edgetunnel
      - name: Checkout edgetunnel
        uses: actions/checkout@v4
        with:
          repository: universeglitch/edgetunnel
          path: source
          fetch-depth: 1

      # 同步文件
      # 排除：
      # 1. wrangler.toml
      # 2. .github/workflows/
      - name: Sync files
        run: |
          rsync -av \
            --exclude='wrangler.toml' \
            --exclude='.github/workflows/' \
            --exclude='.git/' \
            source/ ./

          rm -rf source

      # 提交并推送
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: sync from universeglitch/edgetunnel"
            git push
          fi
