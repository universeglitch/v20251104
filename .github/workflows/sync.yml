name: Sync upstream

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream
        run: |
          git remote add upstream https://github.com/universeglitch/edgetunnel.git
          git fetch upstream

      - name: Sync
        run: |
          git checkout main
          git merge edgetunnel/main --no-edit

      - name: Push
        run: |
          git push origin main
